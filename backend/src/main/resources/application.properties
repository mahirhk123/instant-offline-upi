spring.application.name=instant-offline-upi

# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# MySQL Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/instant_offline_upi}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mahir@101225}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Logging
# ==========================
logging.level.com.instantupi.offline=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ==========================
# Custom Application Properties
# ==========================

# Idempotency window
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window
upi.mesh.packet-max-age-seconds=86400